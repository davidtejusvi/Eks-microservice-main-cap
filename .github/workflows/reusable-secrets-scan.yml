# Reusable: scan the whole repo history for committed secrets (gitleaks).
# Based on class example 14-secrets-scan.yaml.
# ADVISORY: findings are reported but do not fail the pipeline
# (continue-on-error). Remove continue-on-error to make it a blocking gate.
name: Reusable - Secrets Scan

on:
  workflow_call:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # full history so gitleaks can scan every commit
      - uses: gitleaks/gitleaks-action@v3
        continue-on-error: true     # advisory — report leaks without blocking
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed for orgs
