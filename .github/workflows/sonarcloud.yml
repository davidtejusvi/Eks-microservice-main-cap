# Optional: SonarCloud analysis for the Python analytics-service.
# From class example 19-sonar_Cloud_Scan.yml. Kept OUT of the blocking CI/CD
# pipeline and triggered manually, because it requires external setup:
#   1. A SonarCloud project + organization
#   2. secrets.SONAR_TOKEN in the repo
#   3. A sonar-project.properties file (projectKey / organization)
# Flip the trigger to `push` once those are in place to gate every merge.
name: SonarCloud Code Quality

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # required by SonarCloud for git history

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analytics-service/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        working-directory: analytics-service
        # exit code 5 = "no tests found" — allowed so the scan still runs
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.branch.name=main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}